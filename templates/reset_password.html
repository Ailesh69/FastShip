<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password — FastShip</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .header {
            background-color: #d93025;
            padding: 28px 24px;
            text-align: center;
        }
        .header h1 {
            color: #fff;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .header p {
            color: #ffd0ce;
            font-size: 13px;
            margin-top: 4px;
        }
        .body {
            padding: 32px 28px;
        }
        .body p.subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .field {
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus {
            border-color: #d93025;
        }
        .error-msg {
            color: #d93025;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .btn {
            width: 100%;
            padding: 13px;
            background-color: #d93025;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #b5271e; }
        .footer {
            text-align: center;
            padding: 16px 24px;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>FastShip Deliveries</h1>
        <p>Set a new password</p>
    </div>

    <div class="body">
        <p class="subtitle">Enter your new password below. Make sure it's at least 8 characters.</p>

        <form id="resetForm" method="POST" action="{{ action_url }}">
            <input type="hidden" name="token" value="{{ token }}" />

            <div class="field">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required minlength="8" />
            </div>

            <div class="field">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required minlength="8" />
                <div class="error-msg" id="mismatch-error">Passwords do not match.</div>
            </div>

            <button type="submit" class="btn">Reset Password</button>
        </form>
    </div>

    <div class="footer">&copy; 2026 FastShip Deliveries</div>
</div>

<script>
    document.getElementById('resetForm').addEventListener('submit', function (e) {
        const np = document.getElementById('new_password').value;
        const cp = document.getElementById('confirm_password').value;
        const err = document.getElementById('mismatch-error');
        if (np !== cp) {
            e.preventDefault();
            err.style.display = 'block';
        } else {
            err.style.display = 'none';
        }
    });
</script>
</body>
</html>
